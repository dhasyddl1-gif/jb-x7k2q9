<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>취업알림</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mu:#666;--bd:#e3e3e3;--ac:#2563eb;--cd:#f7f7f8}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--mu:#9a9a9a;--bd:#333;--ac:#7aa7ff;--cd:#1c1c1e}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Noto Sans KR",sans-serif}
.w{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0}
.mu{color:var(--mu);font-size:13px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
button,input{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--fg);border-radius:8px;padding:6px 10px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input{flex:1;min-width:140px}
.it{border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:10px;margin:8px 0}
.it a{color:var(--ac);text-decoration:none;font-weight:600}
.pg{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:12px 0}
</style></head><body><div class="w">
<h1>📋 취업알림</h1><div id="meta" class="mu"></div>
<div class="bar" id="modes"></div><div class="bar" id="tabs"></div>
<div class="bar"><input id="q" placeholder="제목/회사 검색"></div>
<div id="list"></div><div class="pg" id="pg"></div></div>
<script>
(function(){
var PER=50;
var P=new URLSearchParams(location.search);
var fileParam = P.get("f");
var st={m:fileParam ? "snapshot" : (P.get("m")==="t"?"t":"y"),s:0,p:1,q:"",ex:false}; // 👈 ex: false 추가
var D=null;
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function btn(txt,on,fn){var b=el("button",on?"on":"",txt);b.onclick=fn;return b}
function fd(s){if(!s)return s;var m=String(s).match(/(\d{4})[.\-\/](\d{2})[.\-\/](\d{2})/);return m?m[1].slice(2)+"/"+m[2]+"/"+m[3]:s}
function load(){
 $("list").textContent="불러오는 중...";
 var targetJson = fileParam ? (fileParam + ".json") : (st.m==="t"?"d_today.json":"d_yesterday.json");
 fetch(targetJson + "?t=" + Date.now())
 .then(function(r){if(!r.ok)throw 0;return r.json()})
 .then(function(d){D=d;st.s=0;st.p=1;render()})
 .catch(function(){
  D=null;$("meta").textContent="";$("tabs").textContent="";$("pg").textContent="";
  $("list").textContent="데이터가 아직 없거나 배포 중입니다. 잠시 후 새로고침 해주세요.";
  modes();
 });
}
function modes(){
 var md=$("modes");md.textContent="";
 if(fileParam){
  md.appendChild(btn("📌 발송 시점 보존 기록",true,function(){}));
  md.appendChild(btn("최신 오늘 공고 보기",false,function(){location.href=location.pathname+"?m=t"}));
 }else{
  md.appendChild(btn("어제 등록/수정",st.m==="y",function(){st.m="y";load()}));
  md.appendChild(btn("오늘 등록/수정(수동)",st.m==="t",function(){st.m="t";load()}));
 }
 // 👈 상단에 토글 스위치 버튼 추가
 md.appendChild(btn(st.ex ? "🚫 제외공고 보는 중 (클릭 시 복귀)" : "🚫 제외공고 보기", st.ex, function(){
  st.ex = !st.ex;
  st.p = 1;
  render();
 }));
}
function render(){
 modes();
 $("meta").textContent=D.label+" · 갱신 "+D.upd;
 var tb=$("tabs");tb.textContent="";
 D.sites.forEach(function(s,i){
  var cnt = st.ex ? ((s.ex && s.ex.length) || 0) : s.i.length;
  tb.appendChild(btn(s.n+" ("+cnt+")",i===st.s,function(){st.s=i;st.p=1;render()}))
 });
 var s=D.sites[st.s];
 var q=st.q.toLowerCase();
 // 👈 토글 ON이면 제외공고(s.ex), OFF면 정상공고(s.i) 출력
 var targetList = st.ex ? (s.ex || []) : s.i;
 var L=targetList.filter(function(r){return !q||(r[1]+" "+r[2]).toLowerCase().indexOf(q)>-1});
 var tot=Math.max(1,Math.ceil(L.length/PER));
 if(st.p>tot)st.p=tot;
 var ls=$("list");ls.textContent="";
 if(s.x)ls.appendChild(el("div","mu","제외검색어로 "+s.x+"건 제외됨"));
 if(!L.length){ls.appendChild(el("div","",s.i.length?"검색 결과 없음":"해당 일자 공고 없음"))}
 var isGov=(s.n.indexOf("남구청")>-1||s.n.indexOf("타 구청")>-1||s.n.indexOf("시청")>-1||s.n.indexOf("부산일자리")>-1||s.n.indexOf("사회서비스원")>-1||s.n.indexOf("경제진흥원")>-1||s.n.indexOf("원티드")>-1||s.n.indexOf("국가유산청")>-1);
 L.slice((st.p-1)*PER,st.p*PER).forEach(function(r){
  var d=el("div","it");
  var link = (r[0] && r[0].indexOf("http") === 0) ? r[0] : ((s.b.slice(-1)==="=" || s.b.slice(-1)==="/") ? (s.b + r[0]) : (s.b + (r[0].indexOf("/")===0 ? r[0] : "/" + r[0])));
  var a=el("a","",(r[6]?"[수정] ":"")+r[1]);a.href=link;a.target="_blank";a.rel="noopener";
  d.appendChild(a);
  if(isGov){
   var meta=[];
   if(r[5] && s.n!=="부산사회서비스원")meta.push(r[5]);
   if(r[3] && (s.n==="부산시청"||s.n.indexOf("취업정보")>-1||s.n.indexOf("일자리")>-1||s.n.indexOf("경제진흥원")>-1||s.n.indexOf("타 구청")>-1||s.n.indexOf("원티드")>-1||s.n.indexOf("국가유산청")>-1))meta.push(r[3]);
   if(r[4])meta.push("등록: "+fd(r[4]));
   if(meta.length)d.appendChild(el("div","mu",meta.join(" | ")));
  }else{
   d.appendChild(el("div","mu",r[2]));
   var x=[r[3],r[4],r[5]].filter(Boolean).join(" | ");
   if(x)d.appendChild(el("div","mu",x));
  }
  ls.appendChild(d);
 });
 var pg=$("pg");pg.textContent="";
 if(tot>1){for(var i=1;i<=tot;i++){(function(n){pg.appendChild(btn(String(n),n===st.p,function(){st.p=n;render();window.scrollTo(0,0)}))})(i)}}
}
$("q").oninput=function(){st.q=this.value;st.p=1;if(D)render()};
load();
})();
</script></body></html>
